services:
  app:
    image: node:18-alpine
    container_name: bromsnor-app
    working_dir: /app
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    networks:
      - bromsnor-network

  nginx:
    image: nginx:latest
    container_name: bromsnor-nginx
    ports:
      - "80:80"
    restart: unless-stopped
    volumes:
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - bromsnor-network
    depends_on:
      - app

networks:
  bromsnor-network:
    driver: bridge

volumes:
  app_node_modules: {}
