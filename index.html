<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOOT — veilig rijden in Utrecht</title>
<meta name="description" content="Deelscooter-navigatie voor Utrecht die je om verboden zones heen leidt.">
<meta name="theme-color" content="#8b5cf6">

<!-- Map: MapLibre GL (free, no key needed) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Typography from the design (DM Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- The map fills the screen; all UI floats on top. -->
<div id="map"></div>

<!-- Brand chip, top left -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3"/><circle cx="18.5" cy="17" r="3"/><path d="M8.5 17h7"/><path d="M18.5 17V9a2 2 0 0 0-2-2h-2"/><path d="M5.5 14l3.2-6.5h4.1"/><path d="M12.8 7.5 15 12"/></svg>
    </span>
    <span class="brand-name">SCOOT</span>
  </div>
  <div class="top-right">
    <!-- Vehicle choice goes into the API request verbatim (see CONTRACT.md) -->
    <div class="vehicle" role="radiogroup" aria-label="Voertuig">
      <button class="vehicle-option active" data-vehicle="snorfiets" role="radio" aria-checked="true">Snorfiets</button>
      <button class="vehicle-option" data-vehicle="bromfiets" role="radio" aria-checked="false">Bromfiets</button>
    </div>
    <button class="info-button" id="btn-rules" aria-label="Regels en wetgeving">
      <svg width="19" height="19" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 16v-4.5M12 8h.01"/></svg>
    </button>
  </div>
</header>

<!-- Navigation banner (visible while riding) -->
<div class="nav-banner hidden" id="nav-banner" aria-live="polite">
  <div class="nav-banner-main">
    <span class="nav-banner-arrow" id="nav-arrow"></span>
    <span>
      <span class="nav-banner-distance" id="nav-distance">–</span>
      <span class="nav-banner-action" id="nav-action">Rechtdoor</span>
    </span>
  </div>
  <div class="nav-banner-next hidden" id="nav-next"></div>
</div>

<!-- Warning card when approaching a zone -->
<div class="zone-card hidden" id="zone-card" role="alert">
  <div class="zone-card-head">
    <span class="zone-card-icon">!</span>
    <span class="zone-card-text" id="zone-text"></span>
    <button class="zone-card-close" id="zone-close" aria-label="Waarschuwing sluiten">&times;</button>
  </div>
  <div class="zone-card-actions">
    <button class="button danger small" id="zone-reroute">
      <svg width="17" height="17" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="2.6"/><circle cx="18" cy="5" r="2.6"/><path d="M8.5 18.4c5-1 6.5-3 7-6 .4-2.4 1-3.9 2-4.9"/></svg>
      Nieuwe route
    </button>
  </div>
</div>

<!-- Rules screen: the design's "Welkom in Utrecht" page.
     Shows once on first launch, afterwards via the info button. -->
<section class="rules-screen hidden" id="rules-screen">
  <div class="rules-screen-inner">
    <p class="eyebrow">SCOOT</p>
    <h2 class="rules-title" id="rules-title">Welkom</h2>
    <p class="rules-sub" id="rules-sub"></p>
    <div class="rules-list" id="rules-list"></div>
    <button class="button" id="rules-ok">Ik heb het begrepen
      <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</section>

<!-- ===== Bottom panels: exactly one is visible at any time ===== -->

<!-- 1. Search -->
<section class="panel" id="panel-search">
  <div class="grab" aria-hidden="true"></div>
  <h1 class="panel-title">Waar wil je heen?</h1>
  <div class="search-field">
    <input id="search-input" type="text" placeholder="Zoek op locatie…" autocomplete="off" enterkeyhint="search">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
  </div>
  <div class="suggestions" id="suggestions"></div>
  <p class="hint hidden" id="search-status" aria-live="polite"></p>
  <p class="hint">Of tik op de kaart om een bestemming te kiezen.</p>
</section>

<!-- 2. Route overview -->
<section class="panel hidden" id="panel-overview">
  <div class="grab" aria-hidden="true"></div>
  <button class="back" id="overview-back" aria-label="Terug naar zoeken">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <h2 class="panel-title small">Route overzicht</h2>
  <div class="fromto">
    <div class="fromto-row"><span class="dot start"></span><span><b>Huidige locatie</b><small id="from-area">–</small></span></div>
    <div class="fromto-line"></div>
    <div class="fromto-row"><span class="dot end"></span><span><b id="overview-destination">–</b><small id="to-area">–</small></span></div>
  </div>
  <div class="stats">
    <div class="stat"><span class="stat-value" id="overview-distance">–</span><span class="stat-label">Afstand</span></div>
    <div class="stat"><span class="stat-value accent" id="overview-time">–</span><span class="stat-label">Reistijd</span></div>
    <div class="stat"><span class="stat-value" id="overview-warnings">–</span><span class="stat-label">Waarschuwingen</span></div>
  </div>
  <button class="button" id="start-route">Route starten
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
  </button>
</section>

<!-- 3. Ride view -->
<section class="panel ride hidden" id="panel-ride">
  <div class="ride-stat"><span class="stat-value accent" id="ride-time">–</span><span class="stat-label">Reistijd</span></div>
  <div class="ride-divider"></div>
  <div class="ride-stat"><span class="stat-value" id="ride-distance">–</span><span class="stat-label">Afstand</span></div>
  <div class="ride-divider"></div>
  <div class="ride-stat"><span class="stat-value" id="ride-arrival">–</span><span class="stat-label">Aankomst</span></div>
  <button class="stop" id="stop-route" aria-label="Rit stoppen">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
  </button>
</section>

<!-- 4. Arrived -->
<section class="panel hidden" id="panel-done">
  <div class="grab" aria-hidden="true"></div>
  <div class="done-check" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
  </div>
  <h2 class="panel-title small center">Je bent aangekomen</h2>
  <p class="done-sub" id="done-destination">–</p>
  <div class="stats">
    <div class="stat"><span class="stat-value" id="done-distance">–</span><span class="stat-label">Afstand</span></div>
    <div class="stat"><span class="stat-value" id="done-time">–</span><span class="stat-label">Duur</span></div>
    <div class="stat"><span class="stat-value accent" id="done-warnings">–</span><span class="stat-label">Waarschuwingen</span></div>
  </div>
  <button class="button" id="new-route">Nieuwe route plannen</button>
</section>

<!-- Demo speed (visible while riding; purely for the pitch) -->
<div class="demo-speed hidden" id="demo-speed" aria-label="Demosnelheid">
  <button data-x="1" >1&times;</button>
  <button data-x="8" class="active">8&times;</button>
  <button data-x="25">25&times;</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
