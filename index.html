<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOOT — veilig rijden in Utrecht</title>
<meta name="description" content="Deelscooter-navigatie voor Utrecht die je om verboden zones heen leidt.">
<meta name="theme-color" content="#8b5cf6">

<!-- Kaart: MapLibre GL (gratis, geen key nodig) -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<!-- Typografie uit het design (DM Sans) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- De kaart vult het hele scherm; alle UI zweeft eroverheen. -->
<div id="kaart"></div>

<!-- Merk-chip linksboven -->
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3"/><circle cx="18.5" cy="17" r="3"/><path d="M8.5 17h7"/><path d="M18.5 17V9a2 2 0 0 0-2-2h-2"/><path d="M5.5 14l3.2-6.5h4.1"/><path d="M12.8 7.5 15 12"/></svg>
    </span>
    <span class="brand-name">SCOOT</span>
  </div>
  <!-- Voertuigkeuze gaat 1-op-1 mee in het API-verzoek (zie CONTRACT.md) -->
  <div class="voertuig" role="radiogroup" aria-label="Voertuig">
    <button class="voertuig-optie aan" data-voertuig="snorfiets" role="radio" aria-checked="true">Snorfiets</button>
    <button class="voertuig-optie" data-voertuig="bromfiets" role="radio" aria-checked="false">Bromfiets</button>
  </div>
</header>

<!-- Navigatiebanner (alleen zichtbaar tijdens het rijden) -->
<div class="navbanner verborgen" id="navbanner" aria-live="polite">
  <div class="navbanner-hoofd">
    <span class="navbanner-pijl" id="nav-pijl"></span>
    <span>
      <span class="navbanner-afstand" id="nav-afstand">–</span>
      <span class="navbanner-actie" id="nav-actie">Rechtdoor</span>
    </span>
  </div>
</div>

<!-- Waarschuwing bij het naderen van een zone -->
<div class="zonekaart verborgen" id="zonekaart" role="alert">
  <span class="zonekaart-icoon" id="zone-icoon">!</span>
  <span class="zonekaart-tekst" id="zone-tekst"></span>
  <button class="zonekaart-sluit" id="zone-sluit" aria-label="Waarschuwing sluiten">&times;</button>
</div>

<!-- ===== Onderste panelen: er is er altijd precies één zichtbaar ===== -->

<!-- 1. Bestemming zoeken -->
<section class="paneel" id="paneel-zoek">
  <div class="grab" aria-hidden="true"></div>
  <h1 class="paneel-titel">Waar wil je heen?</h1>
  <div class="zoekveld">
    <input id="zoek-invoer" type="text" placeholder="Zoek op locatie…" autocomplete="off" enterkeyhint="search">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
  </div>
  <div class="suggesties" id="suggesties"></div>
  <p class="hint">Of tik op de kaart om een bestemming te kiezen.</p>
</section>

<!-- 2. Route-overzicht -->
<section class="paneel verborgen" id="paneel-overzicht">
  <div class="grab" aria-hidden="true"></div>
  <button class="terug" id="overzicht-terug" aria-label="Terug naar zoeken">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>
  </button>
  <h2 class="paneel-titel klein">Route overzicht</h2>
  <div class="fromto">
    <div class="fromto-rij"><span class="stip start"></span><span><b>Huidige locatie</b><small>Utrecht</small></span></div>
    <div class="fromto-lijn"></div>
    <div class="fromto-rij"><span class="stip eind"></span><span><b id="overzicht-bestemming">–</b><small>Utrecht</small></span></div>
  </div>
  <div class="statistieken">
    <div class="stat"><span class="stat-w" id="overzicht-afstand">–</span><span class="stat-l">Afstand</span></div>
    <div class="stat"><span class="stat-w accent" id="overzicht-tijd">–</span><span class="stat-l">Reistijd</span></div>
    <div class="stat"><span class="stat-w" id="overzicht-waarschuwingen">–</span><span class="stat-l">Waarschuwingen</span></div>
  </div>
  <button class="knop" id="start-route">Route starten
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
  </button>
</section>

<!-- 3. Rijweergave -->
<section class="paneel rijden verborgen" id="paneel-rijden">
  <div class="rij-stat"><span class="stat-w accent" id="rij-tijd">–</span><span class="stat-l">Reistijd</span></div>
  <div class="rij-scheiding"></div>
  <div class="rij-stat"><span class="stat-w" id="rij-afstand">–</span><span class="stat-l">Afstand</span></div>
  <div class="rij-scheiding"></div>
  <div class="rij-stat"><span class="stat-w" id="rij-aankomst">–</span><span class="stat-l">Aankomst</span></div>
  <button class="stop" id="stop-route" aria-label="Rit stoppen">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" fill="none" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
  </button>
</section>

<!-- 4. Aangekomen -->
<section class="paneel verborgen" id="paneel-klaar">
  <div class="grab" aria-hidden="true"></div>
  <div class="klaar-vink" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>
  </div>
  <h2 class="paneel-titel klein midden">Je bent aangekomen</h2>
  <p class="klaar-sub" id="klaar-bestemming">–</p>
  <div class="statistieken">
    <div class="stat"><span class="stat-w" id="klaar-afstand">–</span><span class="stat-l">Afstand</span></div>
    <div class="stat"><span class="stat-w" id="klaar-tijd">–</span><span class="stat-l">Duur</span></div>
    <div class="stat"><span class="stat-w accent" id="klaar-waarschuwingen">–</span><span class="stat-l">Waarschuwingen</span></div>
  </div>
  <button class="knop" id="nieuwe-route">Nieuwe route plannen</button>
</section>

<!-- Demo-snelheid (alleen zichtbaar tijdens het rijden; puur voor de pitch) -->
<div class="demo-snelheid verborgen" id="demo-snelheid" aria-label="Demosnelheid">
  <button data-x="1" >1&times;</button>
  <button data-x="8" class="aan">8&times;</button>
  <button data-x="25">25&times;</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
